<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6 - Cadastro de Contatos</title>
</head>

<body>
    <h1>Cadastro de Contatos</h1>
    <label for="">Nome:</label>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <br><br>
    <label for="">Telefone:</label>
    <input type="number" id="telefone" placeholder="Digite com o DDD">
    <br><br>
    <label for="">E-mail:</label>
    <input type="text" id="email" placeholder="Digite seu e-mail">
    <br><br>

    <button id="cadastrar">Cadastrar</button>
    <ul id="lista"></ul>

    <script>
        const nome = document.getElementById("nome");
        const telefone = document.getElementById("telefone");
        const email = document.getElementById("email");
        const lista = document.getElementById("lista");

        const cadastrar = document.getElementById("cadastrar");

        cadastrar.addEventListener("click", function () {
            let nomeUsuario = nome.value.trim();
            let telefoneUsuario = telefone.value.trim();
            let emailUsuario = email.value.trim();

            if (nomeUsuario === "" || telefoneUsuario === "" || emailUsuario === "") {
                alert("TODOS OS CAMPOS DEVEM SER PREENCHIDOS!!!");
            } else {
                let item = document.createElement("li");
                item.textContent = "Nome: " + nomeUsuario + " | Telefone: " + telefoneUsuario + " | E-mail: " + emailUsuario;

                let btnExcluir = document.createElement("button");
                btnExcluir.textContent = "Excluir";

                lista.appendChild(item);

                nome.value = "";
                telefone.value = "";
                email.value = "";

                btnExcluir.addEventListener("click", function () {
                    item.remove();
                })
                item.appendChild(btnExcluir);
                lista.appendChild(item);

            }
        })


    </script>

</body>

</html>
